<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
<rect width="960" height="560" fill="#F3F4EF"/>
<style>
.label{font:700 15px Arial,sans-serif;fill:#204F60;letter-spacing:1.4px}
.h{font:700 25px Arial,sans-serif;fill:#223047}
.t{font:700 20px Arial,sans-serif;fill:#223047}
.s{font:16px Arial,sans-serif;fill:#56657A}
.xs{font:14px Arial,sans-serif;fill:#56657A}
.wt{font:700 18px Arial,sans-serif;fill:#fff}
.ws{font:14px Arial,sans-serif;fill:#fff}
.panel{fill:#FCFCF9;stroke:#C8CEC0;stroke-width:2}
.dash{fill:none;stroke:#C8CEC0;stroke-width:2;stroke-dasharray:8 8}
.flow{fill:none;stroke:#A94437;stroke-width:3}
.navy{fill:#1D2D4F}
.teal{fill:#2E6E86}
</style>

<text x="48" y="48" class="label">PDP BEFORE / AFTER</text>
<rect x="48" y="86" width="380" height="402" rx="6" class="panel"/>
<rect x="532" y="86" width="380" height="402" rx="6" class="panel"/>
<text x="76" y="126" class="t">Before</text>
<rect x="76" y="150" width="150" height="186" class="dash"/>
<line x1="252" y1="176" x2="392" y2="176" class="dash"/>
<line x1="252" y1="211" x2="376" y2="211" class="dash"/>
<line x1="252" y1="246" x2="398" y2="246" class="dash"/>
<text x="76" y="384" class="s">Free-form copy</text>
<text x="76" y="418" class="s">Repeated decisions</text>
<text x="76" y="452" class="s">Weak reuse across channels</text>
<path d="M454 287h52" class="flow"/>
<path d="M494 273l16 14-16 14" class="flow"/>
<text x="560" y="126" class="t">After</text>
<rect x="560" y="150" width="150" height="186" class="dash"/>
<g>
  <rect x="732" y="150" width="152" height="40" rx="4" class="navy"/>
  <text x="808" y="175" class="wt" text-anchor="middle">Product identity</text>
  <rect x="732" y="202" width="152" height="40" rx="4" class="teal"/>
  <text x="808" y="227" class="wt" text-anchor="middle">Fit + material</text>
  <rect x="732" y="254" width="152" height="40" rx="4" class="navy"/>
  <text x="808" y="279" class="wt" text-anchor="middle">Care + details</text>
  <rect x="732" y="306" width="152" height="40" rx="4" class="teal"/>
  <text x="808" y="331" class="wt" text-anchor="middle">SEO + alt text</text>
</g>
<text x="560" y="384" class="s">Structured fields</text>
<text x="560" y="418" class="s">Reusable outputs</text>
<text x="560" y="452" class="s">Consistent QA</text>

</svg>
