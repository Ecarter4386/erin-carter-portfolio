<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
<rect width="960" height="560" fill="#F3F4EF"/>
<style>
.label{font:700 15px Arial,sans-serif;fill:#204F60;letter-spacing:1.4px}
.h{font:700 25px Arial,sans-serif;fill:#223047}
.t{font:700 20px Arial,sans-serif;fill:#223047}
.s{font:16px Arial,sans-serif;fill:#56657A}
.xs{font:14px Arial,sans-serif;fill:#56657A}
.wt{font:700 18px Arial,sans-serif;fill:#fff}
.ws{font:14px Arial,sans-serif;fill:#fff}
.panel{fill:#FCFCF9;stroke:#C8CEC0;stroke-width:2}
.dash{fill:none;stroke:#C8CEC0;stroke-width:2;stroke-dasharray:8 8}
.flow{fill:none;stroke:#A94437;stroke-width:3}
.navy{fill:#1D2D4F}
.teal{fill:#2E6E86}
</style>

<text x="48" y="48" class="label">ANALYTICS DIAGNOSIS</text>
<text x="48" y="92" class="h">Separate the evidence layers</text>
<g>
  <rect x="45" y="126" width="195" height="92" rx="6" class="navy"/>
  <text x="142.5" y="181" class="wt" text-anchor="middle">Acquisition</text>
  <rect x="270" y="126" width="195" height="92" rx="6" class="teal"/>
  <text x="367.5" y="181" class="wt" text-anchor="middle">Experience</text>
  <rect x="495" y="126" width="195" height="92" rx="6" class="navy"/>
  <text x="592.5" y="181" class="wt" text-anchor="middle">Conversion</text>
  <rect x="720" y="126" width="195" height="92" rx="6" class="teal"/>
  <text x="817.5" y="168" class="wt" text-anchor="middle">Revenue</text>
  <text x="817.5" y="193" class="wt" text-anchor="middle">quality</text>
</g>
<path d="M240 172h30M465 172h30M690 172h30" class="flow"/>
<rect x="70" y="294" width="390" height="170" rx="6" class="dash"/>
<text x="100" y="336" class="t">Observed evidence</text>
<text x="100" y="374" class="s">Traffic · browser · device</text>
<text x="100" y="406" class="s">Core Web Vitals · conversion</text>
<text x="100" y="438" class="s">Revenue and margin context</text>
<rect x="500" y="294" width="390" height="170" rx="6" class="dash"/>
<text x="530" y="336" class="t">Modeled scenario</text>
<text x="530" y="374" class="s">Restore historical traffic</text>
<text x="530" y="406" class="s">Hold conversion constant</text>
<text x="530" y="438" class="s">Label opportunity separately from results</text>

</svg>
