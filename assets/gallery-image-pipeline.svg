<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
<rect width="960" height="560" fill="#F3F4EF"/>
<style>
.label{font:700 15px Arial,sans-serif;fill:#204F60;letter-spacing:1.4px}
.h{font:700 25px Arial,sans-serif;fill:#223047}
.t{font:700 20px Arial,sans-serif;fill:#223047}
.s{font:16px Arial,sans-serif;fill:#56657A}
.xs{font:14px Arial,sans-serif;fill:#56657A}
.wt{font:700 18px Arial,sans-serif;fill:#fff}
.ws{font:14px Arial,sans-serif;fill:#fff}
.panel{fill:#FCFCF9;stroke:#C8CEC0;stroke-width:2}
.dash{fill:none;stroke:#C8CEC0;stroke-width:2;stroke-dasharray:8 8}
.flow{fill:none;stroke:#A94437;stroke-width:3}
.navy{fill:#1D2D4F}
.teal{fill:#2E6E86}
</style>

<text x="48" y="48" class="label">IMAGE PRODUCTION PIPELINE</text>
<g>
  <rect x="45" y="116" width="155" height="104" rx="6" class="panel"/>
  <text x="122.5" y="155" class="t" text-anchor="middle">Source</text>
  <text x="122.5" y="187" class="s" text-anchor="middle">Photo / sample</text>
  <rect x="225" y="116" width="155" height="104" rx="6" class="panel"/>
  <text x="302.5" y="155" class="t" text-anchor="middle">Standards</text>
  <text x="302.5" y="187" class="s" text-anchor="middle">Fit · fabric · crop</text>
  <rect x="405" y="116" width="155" height="104" rx="6" class="navy"/>
  <text x="482.5" y="155" class="wt" text-anchor="middle">Produce</text>
  <text x="482.5" y="187" class="ws" text-anchor="middle">AI-assisted</text>
  <rect x="585" y="116" width="155" height="104" rx="6" class="panel"/>
  <text x="662.5" y="155" class="t" text-anchor="middle">Review</text>
  <text x="662.5" y="187" class="s" text-anchor="middle">Human QA</text>
  <rect x="765" y="116" width="150" height="104" rx="6" class="teal"/>
  <text x="840" y="155" class="wt" text-anchor="middle">Approve</text>
  <text x="840" y="187" class="ws" text-anchor="middle">Release-ready</text>
</g>
<path d="M200 168h25M380 168h25M560 168h25M740 168h25" class="flow"/>
<rect x="90" y="300" width="780" height="176" rx="6" class="panel"/>
<text x="120" y="338" class="t">Quality criteria</text>
<text x="120" y="374" class="s">Silhouette accuracy · material behavior · construction fidelity</text>
<text x="120" y="406" class="s">Color accuracy · consistent scale · clean background · realistic presentation</text>
<line x1="120" y1="432" x2="840" y2="432" stroke="#C8CEC0" stroke-width="2"/>
<text x="480" y="458" class="s" text-anchor="middle">Improve presentation without changing the product.</text>

</svg>
